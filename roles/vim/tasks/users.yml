---
# Create a directory ~/.vim.local in order not to pollute home directory
- name: "[users] Create {{ vim_root_cust_conf_dir ~ ' directory for custom configuration content' }}"   # noqa: key-order[task]
  ansible.builtin.file:
    path: "{{ vim_root_conf_plug_dir }}"
    state: directory
    mode: "0755"
  <<: &vim_users_become_loop
    become: true    # Required for become_user to work
    become_user: "{{ vim_user }}"
    loop: "{{ vim_users }}"
    loop_control:
      loop_var: vim_user
      label: "{{ vim_user }}"
    when: vim_users is defined

- name: "[users] Generate {{ vim_root_config ~ ' from template' }}"   # noqa: key-order[task]
  ansible.builtin.template:
    src: vimrc.j2
    dest: "{{ vim_root_config }}"
    owner: "{{ vim_user }}"
    group: >-
      {{
        vim_user if not 'Darwin' in ansible_system else
        'wheel' if vim_user == 'root' else 'staff'
      }}
    mode: "0644"
  <<: *vim_users_become_loop

- name: "[users] Symlink {{ vim_root_config ~ ' to ~/.vimrc'}}"   # noqa: key-order[task]
  ansible.builtin.file:
    src: "{{ vim_root_config }}"
    dest: ~/.vimrc
    state: link
  <<: *vim_users_become_loop

- name: "[users] Generate {{ vim_root_local_config ~ ' from template' }}"   # noqa: key-order[task]
  ansible.builtin.template:
    src: vimrc.local.j2
    dest: "{{ vim_root_local_config }}"
    owner: "{{ vim_user }}"
    group: >-
      {{
        vim_user if not 'Darwin' in ansible_system else
        'wheel' if vim_user == 'root' else 'staff'
      }}
    mode: "0644"
  <<: *vim_users_become_loop

- name: "[users] Generate {{ vim_root_plugins ~ ' from template' }}"  # noqa: key-order[task]
  ansible.builtin.template:
    src: "{{ vim_pm_config }}.j2"
    dest: "{{ vim_root_plugins }}"
    owner: "{{ vim_user }}"
    group: >-
      {{
        vim_user if not 'Darwin' in ansible_system else
        'wheel' if vim_user == 'root' else 'staff'
      }}
    mode: "0644"
  <<: *vim_users_become_loop

# CONFIGURE PLUGINS
- name: "[users] Generate the ~/.vim/vim.local/vimrc.<plugin> config files from templates"
  ansible.builtin.template:
    src: "{{ vim_config.1.src }}"
    dest: "{{ vim_config.1.path }}"
    owner: "{{ vim_config.0 }}"
    group: >-
      {{
        vim_config.0 if not 'Darwin' in ansible_system else
        'wheel' if vim_config.0 == 'root' else 'staff'
      }}
    mode: "0644"
  become: true
  become_user: "{{ vim_config.0 }}"
  loop: "{{ vim_users | product(vim_checklist, vim_plugins) | list }}"
  loop_control:
    loop_var: vim_config
    label: "{{ vim_config.0 }}: {{ vim_config.1.name }} / {{ vim_config.2.name }}"
  when:
    - vim_users is defined
    - "vim_config.1.name in vim_config.2.name"

# This task causes idempotency issue
- name: "[users] Copying .vim folder to ~/.vim"   # noqa: key-order[task]
  ansible.builtin.copy:
    src: vim/
    dest: ~/.vim/
    owner: "{{ vim_user }}"
    group: >-
      {{
        vim_user if not 'Darwin' in ansible_system else
        'wheel' if vim_user == 'root' else 'staff'
      }}
    directory_mode: "0755"
    mode: "0644"
  <<: *vim_users_become_loop

