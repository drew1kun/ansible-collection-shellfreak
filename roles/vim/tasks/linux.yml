---
- name: "[linux] Make sure vim-tiny is uninstalled"
  ansible.builtin.package:
    name: vim-tiny
    state: absent
    purge: true
  become: true

- name: "[linux] Make sure vim-nox is installed"
  ansible.builtin.package:
    name: vim-nox
    state: present
  become: true

# Analog of 'update-alternatives --set editor /usr/bin/vim.nox'
- name: "[linux] Setting vim default editor for visudo"
  community.general.alternatives:
    name: editor
    path: /usr/bin/vim.nox
  become: true
