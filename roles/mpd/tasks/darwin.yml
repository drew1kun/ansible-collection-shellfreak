---
- name: '[darwin] Install mpd with Homebrew'
  community.general.homebrew:
    name:
      - mpd
      - mpc
      - ncmpcpp
    state: present

# - name: '[darwin] Check if ~/Library/LaunchAgents/homebrew.mxcl.mpd.plist exists'
