---
galaxy_info:
  role_name: vim
  author: drew1kun
  description: |
    Role that installs and configures vim/neovim with plugin managers
    like plug/vundle with a set of preconfigured plugins and themes.
    This is a feature/speed-balanced IDE-like configuration.
  license: MIT
  min_ansible_version: "1.9"
  platforms:
    - name: MacOSX
      versions:
        - all
    - name: Ubuntu
      versions:
        - all
    - name: Debian
      versions:
        - all
  galaxy_tags:
    - vim
    - development
    - system
    - nvim
    - neovim
    - vundle
    - plug
    - plugin
    - ubuntu
    - trusty
    - kali
    - debian
    - wheezy
    - jessie
    - stretch
    - buster
    - bullseye
    - macos
    - osx

dependencies:
  - role: drew1kun.shellfreak.pip
    when: vim_env is defined
    pip_venv_user: >-
      {{
        ansible_user_id
        if 'user' in vim_env
        else 'root'
      }}
    pip_venv_path: >-
      {{
        ansible_user_dir ~ '/.local/share/nvim/python-venv'
        if 'user' in vim_env
        else '/opt/nvim/python-venv'
      }}
    pip_packages:
      - pynvim
