- name: "[users] Set EDITOR and TERM environment variables"
  ansible.builtin.blockinfile:
    path: ~/.zshrc
    owner: "{{ vim_user }}"
    group: "{{ vim_user }}"
    content: |
      export EDITOR="/usr/bin/vim"
      export TERM="xterm-256color"  # For vim colors in tmux
    marker: "# {mark} ======== VIM role: Ansible managed block ========="
  become: true    # Required for become_user to work
  become_user: "{{ vim_user }}"
  loop: "{{ vim_users }}"
  loop_control:
    loop_var: vim_user
    label: "{{ vim_user }}"
  when: "not 'Darwin' in ansible_system"

- name: "[users] Include {{ vim_plugin_manager ~ ' plugin manager and plugins installation tasks' }}"
  ansible.builtin.include_tasks:
    file: "{{ vim_plugin_manager }}.yml"
    apply:
      tags:
        - always
  tags:
    - always

- name: "[nvim] Create user-wide Neovim configuration"
  ansible.builtin.file:
    src: "{{ item.1.src }}"
    dest: "{{ item.1.dest }}"
    state: link
  loop: >-
    {{
      vim_users
      | product([
          {
            'src': vim_root_dir,
            'dest': '~/.config/nvim'
          },
          {
            'src': vim_root_config,
            'dest': '~/.config/nvim/init.vim'
          }
        ])
      | list
    }}
  tags:
    - vim_neovim
